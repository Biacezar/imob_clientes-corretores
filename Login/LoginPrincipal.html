<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMOB Tá Na Mão - Login</title>
    <link rel="stylesheet" href="LoginPricipal.css">
</head>
<body>

    <div class="container">
        <!-- Coluna da Esquerda: Logótipo e Títulos -->
        <div class="brand-section">
            <div class="logo-box">
                <!-- Substituir pela imagem do logótipo -->
                <img src="../imagens/imobLogo.jpg" alt="IMOB Tá Na Mão">
            </div>
            <h1 class="title">Acesse sua conta</h1>
            <p class="subtitle">Plataforma de gestão IMOB Tá Na Mão</p>
        </div>

        <!-- Coluna da Direita: Formulário de Login -->
        <div class="form-section">
            <div class="card">
                <form>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="">
                    </div>
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="">
                    </div>
                    <button type="submit" class="btn-primary">Entrar</button>
                    <button type="button" class="btn-secondary">Continuar como cliente</button>
                </form>
            </div>
            <p>Ainda não tem conta? <a href="../Primeiro cadastro/cadastro.html">Primeiro Acesso</a></p>

            <div class="demo-card">
                <span>&#9654;</span> Acessos de demonstração
            </div>

            <div class="footer-text">
                IMOB Imobiliária &bull; CRECI 050285-J
            </div>
        </div>
    </div>

</body>
</html>
