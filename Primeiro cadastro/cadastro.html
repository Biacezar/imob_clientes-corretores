<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Acesso - IMOB Tá Na Mão</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="container">
        <section class="brand-section" aria-label="IMOB Tá Na Mão">
            <div class="logo-box">
                <img src="../imagens/imobLogo.jpg" alt="IMOB Tá Na Mão">
            </div>
            <h1 class="title">Crie sua conta</h1>
            <p class="subtitle">Faça seu primeiro acesso à plataforma</p>
        </section>

        <main class="form-section">
            <div class="card">
                <form id="formCadastro">
                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" required placeholder="Digite seu nome">
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="Digite seu e-mail">
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required placeholder="Crie uma senha">
                    </div>

                    <fieldset class="profile-group">
                        <legend>Tipo de conta</legend>
                        <label class="profile-option">
                            <input type="radio" name="perfil" value="cliente" checked onchange="toggleCreci(false)"> Sou cliente
                        </label>
                        <label class="profile-option">
                            <input type="radio" name="perfil" value="corretor" onchange="toggleCreci(true)"> Sou corretor
                        </label>
                    </fieldset>

                    <div id="campoCreci" class="input-group creci-field">
                        <label for="creci">Número do CRECI</label>
                        <input type="text" id="creci" placeholder="Ex: 050285-J">
                    </div>

                    <button type="submit" class="btn-primary">Finalizar cadastro</button>
                </form>
            </div>

            <p class="login-link">Já tem conta? <a href="../index.html">Voltar para o login</a></p>
        </main>
    </div>

    <script>
        // Função para mostrar o CRECI só quando selecionar 'Corretor'
        function toggleCreci(mostrar) {
            const campo = document.getElementById('campoCreci');
            campo.style.display = mostrar ? 'block' : 'none';
        }
    </script>
</body>
</html>
