<form id="formCadastro">
  <label for="nome">Nome Completo:</label>
  <input type="text" id="nome" required>

  <label for="email">E-mail:</label>
  <input type="email" id="email" required>

  <label for="senha">Senha:</label>
  <input type="password" id="senha" required>

  <p>Perfil de Acesso:</p>
  <label>
    <input type="radio" name="perfil" value="cliente" checked> Cliente
  </label>
  <label>
    <input type="radio" name="perfil" value="corretor"> Corretor (requer CRECI)
  </label>

  <!-- Campo extra se for corretor -->
  <div id="campoCreci" style="display: none;">
    <label for="creci">Número do CRECI:</label>
    <input type="text" id="creci">
  </div>

  <button type="submit">Cadastrar</button>
</form>
