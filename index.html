<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMOB Tá Na Mão</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:"var(--blue)",gold:"var(--gold)",bg:"var(--bg)",surface:"var(--surface)",ink:"var(--ink)",muted:"var(--muted)",line:"var(--line)"}}}}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
    <a href="#cliente" class="font-extrabold text-lg" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)"><img id="hdrLogo" alt="Logo IMOB Tá Na Mão" style="height:48px;width:auto;flex:none;border-radius:6px"><span style="white-space:nowrap">IMOB <span class="text-gold">Tá Na Mão</span></span></a>
    <div id="who" class="flex items-center gap-2" style="order:3"></div><nav class="flex gap-1 overflow-x-auto" style="order:2;max-width:100%">
      <a class="tab" href="#cliente" data-t="cliente">Início</a><a class="tab" href="#cadastro" data-t="cadastro">Cadastro</a>
      <a class="tab" href="#corretor" data-t="corretor">Corretor</a><a class="tab" href="#acomp" data-t="acomp">Acompanhamento</a><a class="tab" href="#historico" data-t="historico">Histórico</a>
      <a class="tab" href="#gestor" data-t="gestor">Gestor</a>
    </nav>
  </div>
</header>
<main id="app" class="max-w-5xl mx-auto px-4 py-5 space-y-5"></main>
<div id="login" style="position:fixed;inset:0;background:#EFE9E2;display:none;overflow:auto;z-index:60"></div>
<div id="modal" style="position:fixed;inset:0;background:rgba(5,15,35,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:40"></div>
<footer class="text-center text-xs text-muted py-6">IMOB Imobiliária · CRECI 050285-J · Projeto Integrador “IMOB Tá Na Mão”</footer>
<div id="toast" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:50"></div>

<script src="js/app.js"></script>
</body>
</html>
